# /etc/nginx/sites-available/kerjaku.conf  (symlinked into sites-enabled/)
#
# Context: this file is included inside the `http {}` block of nginx.conf,
# so the map / log_format / upstream / real_ip directives below are http-level.
#
# Traffic path:  Client --HTTPS--> ALB (TLS terminates here) --HTTP:80--> Nginx --> 127.0.0.1:3000 (Docker)
#
# Assumptions
#   - VPC CIDR is 10.0.0.0/16 (web servers are 10.0.1.11 / 10.0.1.12). Only the ALB can reach port 80
#     (enforced by the security group, not by this file).
#   - The ALB listener on :80 redirects to :443, so normally every request arrives with X-Forwarded-Proto: https.
#   - CV uploads live in S3 and are served to users with short-lived pre-signed URLs generated by the app,
#     so Nginx no longer serves /uploads from local disk.

# ---------------------------------------------------------------- real client IP
# Trust X-Forwarded-For only when the request comes from inside the VPC (i.e. from the ALB).
set_real_ip_from 10.0.0.0/16;
real_ip_header   X-Forwarded-For;
real_ip_recursive on;

# ---------------------------------------------------------------- structured access log
log_format kerjaku_json escape=json
  '{"time":"$time_iso8601","client_ip":"$remote_addr","method":"$request_method",'
  '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
  '"request_time":$request_time,"upstream_time":"$upstream_response_time",'
  '"upstream_status":"$upstream_status","user_agent":"$http_user_agent",'
  '"referer":"$http_referer","amzn_trace_id":"$http_x_amzn_trace_id"}';

# ---------------------------------------------------------------- upstream (the Node.js container)
upstream kerjaku_app {
    server 127.0.0.1:3000 max_fails=0;   # single upstream: never mark it "down" inside nginx, let the ALB decide
    keepalive 32;                         # reuse connections to Node instead of opening one per request
}

# ---------------------------------------------------------------- default server
# Catches requests whose Host header is not ours (scanners, ALB health checks which use the
# target IP as Host). Only the health endpoints answer; everything else is dropped.
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    access_log off;

    # Liveness of nginx itself. NOT used by the ALB any more (see Part 4 Q3).
    location = /nginx-health {
        default_type text/plain;
        return 200 "ok\n";
    }

    # ALB target-group health check path. Proxied to the app, so if the app is down the
    # target goes unhealthy and the ALB stops sending users to this server.
    location = /health {
        proxy_pass            http://kerjaku_app/health;
        proxy_http_version    1.1;
        proxy_set_header      Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout    3s;
    }

    location / {
        return 444;   # close the connection without a response
    }
}

# ---------------------------------------------------------------- the real site
server {
    listen 80;
    server_name kerjaku.example.com;

    server_tokens off;            # don't advertise the nginx version
    # NOTE: no `root` and no `autoindex`. Nginx serves nothing from disk; the app directory
    # (which contains .env, .git, node_modules) is never exposed.

    # CV uploads are typically < 5 MB. 10 MB leaves headroom without letting one client
    # fill the disk or tie up workers with huge bodies.
    client_max_body_size 10m;
    client_body_timeout  30s;

    # Must be LONGER than the ALB idle timeout (default 60s). If nginx closes an idle
    # keep-alive connection first, the ALB can reuse a dead connection and return 502s.
    keepalive_timeout 75s;

    access_log /var/log/nginx/kerjaku.access.log kerjaku_json;
    error_log  /var/log/nginx/kerjaku.error.log warn;

    # Defence in depth: if the ALB ever forwards plain HTTP, upgrade it.
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    # ------------------------------------------------ security headers (sent on every response, incl. errors)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    # Content-Security-Policy is best set by the app (it knows which scripts/CDNs it uses).

    # ------------------------------------------------ never serve dotfiles (.env, .git, .htpasswd ...)
    location ~ /\.(?!well-known/) {
        deny all;
        return 404;
    }

    location = /health {
        access_log off;
        proxy_pass http://kerjaku_app/health;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
    }

    location / {
        proxy_pass         http://kerjaku_app;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";

        # Tell the app who the real client is and that the original request was HTTPS
        # (needed for secure cookies, redirects and rate limiting by IP).
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;               # real client IP (after real_ip module)
        proxy_set_header X-Forwarded-For   $http_x_forwarded_for;      # pass the ALB's chain through unchanged
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;    # "https" from the ALB
        proxy_set_header X-Forwarded-Port  $http_x_forwarded_port;
        proxy_set_header X-Amzn-Trace-Id   $http_x_amzn_trace_id;      # correlate app logs with ALB logs

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;   # keep <= ALB idle timeout

        proxy_buffering on;
        proxy_buffers   16 16k;
        proxy_buffer_size 16k;
    }
}
