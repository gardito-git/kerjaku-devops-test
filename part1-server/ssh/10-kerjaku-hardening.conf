# /etc/ssh/sshd_config.d/10-kerjaku-hardening.conf
#
# Short-term hardening while SSH still exists. The target state is: port 22 closed in the
# security group entirely and all shell access through AWS SSM Session Manager
# (IAM-authenticated, logged to CloudTrail/S3, no keys to share or revoke).

PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
PermitEmptyPasswords no
MaxAuthTries 3
LoginGraceTime 30
AllowGroups ssh-users          # only named, personal accounts in this group
X11Forwarding no
AllowAgentForwarding no
ClientAliveInterval 300
ClientAliveCountMax 2
LogLevel VERBOSE               # logs key fingerprint used for each login (attribution)
